name: Create release

on:
  workflow_dispatch:

env:
  BINARY_NAME: gitreforge
  RELEASE_ASSET: gitreforge-linux-x86_64

jobs:
  release:
    runs-on: linux
    container:
      image: docker.io/library/rust:1-bookworm
      env:
        CARGO_HOME: /cargo-cache
        CARGO_TARGET_DIR: /workspace-target/gitreforge
      volumes:
        - gitreforge-cargo-cache:/cargo-cache
        - gitreforge-target-cache:/workspace-target

    steps:
      - name: Check out repository
        run: git clone --depth 1 --branch ${{ github.ref_name }} ${{ github.server_url }}/${{ github.repository }}.git .

      - name: Show build cache state
        run: |
          set -eu

          rustc --version
          cargo --version
          echo "CARGO_HOME=$CARGO_HOME"
          echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR"
          ls -la "$CARGO_HOME" 2>/dev/null || true
          ls -la "$CARGO_TARGET_DIR" 2>/dev/null || true

      - name: Read version
        run: |
          set -eu

          version="$(sed -n '0,/^version = /s/^version = "\(.*\)"$/\1/p' Cargo.toml)"

          case "$version" in
            v*)
              echo "Cargo.toml package.version must not start with v"
              exit 1
              ;;
          esac

          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'

          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Validate tag
        run: |
          set -eu

          git fetch --tags --force

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            tag_commit="$(git rev-list -n 1 "$TAG")"
            head_commit="$(git rev-parse HEAD)"

            if [ "$tag_commit" != "$head_commit" ]; then
              echo "Tag $TAG already exists and points at $tag_commit, not $head_commit"
              exit 1
            fi

            echo "Tag $TAG already exists on this commit; continuing"
            echo "TAG_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "TAG_EXISTS=false" >> "$GITHUB_ENV"
          fi

      - name: Test
        run: cargo test --release --locked

      - name: Build executable
        run: cargo build --release --locked

      - name: Prepare release asset
        run: |
          set -eu

          cp "$CARGO_TARGET_DIR/release/$BINARY_NAME" "$RELEASE_ASSET"
          chmod 755 "$RELEASE_ASSET"

      - name: Create tag
        if: ${{ env.TAG_EXISTS != 'true' }}
        run: |
          set -eu

          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@localhost"

          git tag -a "$TAG" -m "Release $TAG"

      - name: Push tag
        if: ${{ env.TAG_EXISTS != 'true' }}
        run: |
          set -eu

          server="${{ github.server_url }}"
          server="${server#https://}"
          server="${server#http://}"

          git remote set-url origin "https://${{ secrets.GIT_OWNER }}:${{ secrets.GIT_TOKEN }}@$server/${{ github.repository }}.git"
          git push origin "$TAG"

      - name: Create Forgejo release
        run: |
          set -eu

          api="${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases"

          prerelease=false
          case "$VERSION" in
            *-*) prerelease=true ;;
          esac

          payload="$(printf '{"tag_name":"%s","name":"%s","body":"Executable attached: `%s`","draft":false,"prerelease":%s}' "$TAG" "$TAG" "$RELEASE_ASSET" "$prerelease")"

          curl --fail-with-body --show-error \
            -X POST "$api" \
            -H "Authorization: token ${{ secrets.GIT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            -o release.json

      - name: Upload release asset
        run: |
          set -eu

          release_id="$(grep -o '"id":[[:space:]]*[0-9][0-9]*' release.json | head -n 1 | sed 's/[^0-9]//g')"
          test -n "$release_id"
          echo "Uploading asset to release id $release_id"

          upload_url="${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/$release_id/assets?name=$RELEASE_ASSET"

          curl --fail-with-body --show-error \
            -X POST "$upload_url" \
            -H "Authorization: token ${{ secrets.GIT_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$RELEASE_ASSET"
