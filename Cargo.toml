[workspace]
members = ["crates/gitreforgelib"]

[workspace.dependencies]
bstr = "1.3.0"
rustc-hash = "2.1.0"
rayon = "1.7.0"

[package]
name = "gitreforge"
version = "1.0.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"

[[bin]]
name = "gitreforge"
path = "src/main.rs"

[profile.release]
#debug = true
strip="none"
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
bstr.workspace = true
rustc-hash.workspace = true
rayon.workspace = true
regex = "1.10.3"
mimalloc = { version = "0.1.34", default-features = false }
clap = { version = "4.1.8", features = ["derive"] }
clap-markdown = "0.1.4"
gitreforgelib = { version = "1.0.0", path = "crates/gitreforgelib" }
ssh-key = { version = "0.6.7", features = ["crypto"] }
