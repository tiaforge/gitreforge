[workspace]
members = ["crates/gitreforgelib"]

[workspace.dependencies]
bstr = "1.3.0"
rustc-hash = "2.1.0"
rayon = "1.7.0"

[package]
name = "gitreforge"
version = "1.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"

[[bin]]
name = "gitreforge"
path = "src/main.rs"

[profile.release]
#debug = true
strip="none"
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
bstr.workspace = true
rustc-hash.workspace = true
rayon.workspace = true
regex = "1.10.3"
smallvec = "1.15.1"
mimalloc = { version = "0.1.34", default-features = false }
clap = { version = "4.1.8", features = ["derive"] }
clap-markdown = "0.1.4"
gitreforgelib = { version = "1.1.0", path = "crates/gitreforgelib" }
ssh-key = { version = "0.6.7", features = ["crypto"] }
# used directly for faster signing than through ssh-key; the default
# features include the precomputed tables for Ed25519
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["fast", "zeroize"] }
rsa = { version = "0.9.10", default-features = false, features = ["sha2", "u64_digit"] }
sha2 = { version = "0.11.0", default-features = false }
